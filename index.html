<style>
:root{--ink:#1a1a1a;--ink2:#404040;--mute:#7f7f7f;--line:#d9d9d9;--soft:#f2f2f2;--bg:#ffffff;--page:#f5f5f5}

:root[data-theme="dark"]{--ink:#ececec;--ink2:#c8c8c8;--mute:#9a9a9a;--line:#3a3a3a;--soft:#262626;--bg:#1b1b1b;--page:#121212;color-scheme:dark}
*{box-sizing:border-box}
/* 줄바꿈: 한글은 단어 단위로, 긴 URL·영문은 넘칠 때만 끊기 */
/* 한글: 단어 단위 줄바꿈 / 영어: 단어 중간에서 끊지 않음(칸보다 긴 단어만 예외) */
.doc{word-break:keep-all;overflow-wrap:break-word;hyphens:none;line-break:strict}
.nw{white-space:nowrap}
h1,h2,h3,.headline{text-wrap:balance}
table{table-layout:fixed}
th{overflow-wrap:normal;word-break:keep-all}
td{overflow-wrap:break-word}
.contact span{white-space:nowrap}
body{margin:0;background:var(--page);color:var(--ink);font-family:"Pretendard Variable",Pretendard,"Noto Sans KR",-apple-system,"Malgun Gothic",sans-serif;font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar-in{max-width:880px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--ink2);padding:7px 12px;font:inherit;font-size:13px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:600}
.act{display:flex;flex-wrap:wrap;gap:6px}
.act[hidden]{display:none!important}
button:focus-visible,a:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:8px;padding:7px 12px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;text-decoration:none}
.btn.ghost{background:transparent;color:var(--ink)}
.meta{max-width:880px;margin:10px auto 0;padding:0 16px;color:var(--mute);font-size:12px}
.doc{max-width:880px;margin:12px auto 40px;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:44px 52px}
h1{font-size:28px;letter-spacing:-.02em;margin:0 0 6px;padding-bottom:10px;border-bottom:2px solid var(--ink)}
.contact{color:var(--ink2);font-size:13px;margin-bottom:6px}
.headline{font-weight:700;font-size:16px;margin:18px 0 8px}
.summary{background:var(--soft);border-left:3px solid var(--ink2);padding:10px 14px;margin:0 0 6px}
.summary p{margin:2px 0}
h2{font-size:17px;margin:28px 0 10px;padding-bottom:4px;border-bottom:1px solid var(--line)}
h3{font-size:15px;margin:18px 0 2px;color:var(--ink)}
.role{font-weight:600;color:var(--ink2);margin:0}
.role span{font-weight:400}
.desc{color:var(--mute);font-size:13px;margin:0 0 4px}
.grp{font-weight:700;margin:10px 0 2px;font-size:13.5px}
ul{margin:4px 0 6px;padding-left:18px}
li{margin:2px 0}
li ul{margin:2px 0}
b{font-weight:700}
table{width:100%;border-collapse:collapse;margin:6px 0 10px;font-size:13px}
th,td{border:1px solid var(--line);padding:6px 9px;vertical-align:top;text-align:left}
th{background:var(--soft);width:8.5em;font-weight:600}
thead th{background:var(--ink);color:var(--bg);width:auto}
.proj{border-left:2px solid var(--line);padding-left:12px;margin:12px 0}
.proj .t{font-weight:700}
.proj .t span.meta{font-weight:400;color:var(--mute);margin-left:.35em}
.proj .t span.meta.own-line{margin-left:0;white-space:nowrap}
th small{display:block;font-weight:400;color:var(--mute);font-size:.92em}
.proj table{table-layout:auto}
.proj th{width:1%;white-space:nowrap}
@media (max-width:640px){.doc{padding:24px 16px;margin:10px 0 30px;border-radius:0;border-left:0;border-right:0}h1{font-size:23px}th{width:7.5em}}
@page{size:A4;margin:14mm 14mm}
@media print{
  :root{--ink:#111;--ink2:#333;--mute:#666;--line:#bbb;--soft:#f0f0f0;--bg:#fff;--page:#fff}
  html{filter:grayscale(100%)}
  .bar,.meta{display:none!important}
  body{background:#fff;font-size:10.5pt}
  .doc{border:0;margin:0;padding:0;max-width:none}
  h2,h3,.proj,tr{break-inside:avoid-page}
  h2,h3{break-after:avoid-page}
  a{color:inherit;text-decoration:none}
}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700&display=swap">

    <button id="l-ko" aria-pressed="true">국문</button>

  </div>
  <div class="act" id="act" hidden>
    <button class="btn" id="print">PDF 저장</button>
    <a class="btn ghost" id="word" href="#" download>Word 저장</a>
  </div>
</div></div>
<div class="meta" id="meta"></div>
<main class="doc" id="doc"></main>

<script>
const D = JSON.parse(document.getElementById('data').textContent);
const st = {doc: 'resume', lang: 'ko'};
try { const s = JSON.parse(localStorage.getItem('cv-view') || '{}'); if (s.doc) st.doc = s.doc; if (s.lang) st.lang = s.lang; } catch (e) {}
const hm = (location.hash || '').slice(1).match(/^(resume|career)(?:-(ko|en))?$/);
if (hm) { st.doc = hm[1]; if (hm[2]) st.lang = hm[2]; }
const esc = s => String(s);
const ul = arr => '<ul>' + arr.map(i => '<li>' + esc(i) + '</li>').join('') + '</ul>';
const meta = m => String(m).replace(/\s*\(([^()]*)\)\s*$/, ' <small class="note">($1)</small>');
const tbl = rows => rows.length ? '<table>' + rows.map(r => '<tr><th>' + r[0] + '</th><td>' + r[1] + '</td></tr>').join('') + '</table>' : '';

const proj = p => `<div class="proj"><div class="t">${p.title}<span class="meta">| ${p.meta}</span></div>${ul(p.items)}${p.table ? tbl(p.table) : ''}</div>`;

function head(L) {
  return `<h1>${L.name}</h1><div class="contact">${L.contact.split(' · ').map(c => '<span>' + c + '</span>').join(' · ')}</div>
  <div class="headline">${L.headline}</div>
  <div class="summary">${L.summary.map(p => '<p>' + p + '</p>').join('')}</div>`;
}
function tail(L) {
  const b = L.labels;
  return `<h2>${b.education}</h2><p>${L.education}</p>
  <h2>${b.certs} · ${b.skills} · ${b.languages}</h2>
  ${tbl([[b.certs, L.certs], [b.skills, L.skills], [b.languages, L.languages]])}`;
}
function resume(L) {
  const b = L.labels;
  return head(L) +
    `<h2>${b.competencies}</h2><ul>${L.competencies.map(c => `<li><b>${c[0]}:</b> ${c[1]}</li>`).join('')}</ul>
    <h2>${b.experience}</h2>` +
    L.experience.map(e => `<h3>${e.company}</h3><p class="role">${e.role} <span>| ${e.period}</span></p><p class="desc">${e.desc}</p>${ul(e.resume)}`).join('') +
    `<h2>${b.projects}</h2>` +
    L.projects.map(proj).join('') +
    tail(L);
}
function career(L) {
  const b = L.labels;
  return head(L) +
    L.experience.map((e, i) => `<h2>${i + 1}. ${e.company} | ${e.period}</h2>
      <p class="role">${e.role}</p><p class="desc">${e.desc}</p>${tbl(e.overview)}
      ${e.career.map(g => `<div class="grp">${g.group}</div>${ul(g.items)}`).join('')}`).join('') +
    `<h2>${b.projects}</h2>` +
    L.projects.map(proj).join('') +
    tail(L);
}

function fitLines() {
  document.querySelectorAll('.proj .t').forEach(t => {
    const s = t.querySelector('span.meta'); if (!s) return;
    if (!s.dataset.orig) s.dataset.orig = s.textContent;
    s.textContent = s.dataset.orig; s.classList.remove('own-line'); s.style.fontSize = '';
    t.querySelectorAll('br.ownbr').forEach(b => b.remove());
    const one = parseFloat(getComputedStyle(t).lineHeight) || 22;
    const wraps = () => t.getBoundingClientRect().height > one * 1.4;
    let f = 1;
    while (wraps() && f > 0.8) { f -= 0.03; s.style.fontSize = f.toFixed(2) + 'em'; }
    if (wraps()) {  // still too long: put company and dates on their own line instead of breaking them
      s.style.fontSize = ''; s.classList.add('own-line'); s.textContent = s.dataset.orig.replace(/^\|\s*/, '');
      const br = document.createElement('br'); br.className = 'ownbr'; t.insertBefore(br, s);
    }
  });
}
window.addEventListener('resize', fitLines);
window.addEventListener('beforeprint', fitLines);

function keepHyphenWords(root) {
  // keep tokens joined by '-' or '·' together (multi-entity, 설계·구축, (Project RUN-AWAY)) so lines never break inside them
  const re = /(?:(?:[A-Z][a-z]{2} )?\d{4}(?:\.\d{2})? ?[~–] ?(?:(?:[A-Z][a-z]{2} )?\d{4}(?:\.\d{2})?|현재|Present)(?: \([^)]*\))?)|[^\s]*[A-Za-z0-9가-힣&]+(?:[-·][A-Za-z0-9가-힣&]+)+[^\s]*/gu;
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const nodes = []; while (w.nextNode()) { re.lastIndex = 0; if (re.test(w.currentNode.nodeValue)) nodes.push(w.currentNode); }
  nodes.forEach(n => {
    if (n.parentNode.classList && n.parentNode.classList.contains('nw')) return;
    const frag = document.createDocumentFragment(); let last = 0; const t = n.nodeValue; re.lastIndex = 0; let m;
    while ((m = re.exec(t))) {
      frag.appendChild(document.createTextNode(t.slice(last, m.index)));
      const sp = document.createElement('span'); sp.className = 'nw'; sp.textContent = m[0]; frag.appendChild(sp);
      last = m.index + m[0].length;
    }
    frag.appendChild(document.createTextNode(t.slice(last))); n.parentNode.replaceChild(frag, n);
  });
}
function render() {
  const L = D[st.lang];
  document.documentElement.lang = st.lang;
  document.getElementById('doc').innerHTML = st.doc === 'resume' ? resume(L) : career(L);
  keepHyphenWords(document.getElementById('doc'));
  document.getElementById('meta').textContent = `${L.labels[st.doc === 'resume' ? 'resumeTitle' : 'careerTitle']} · ${L.labels.updated}: ${D.lastUpdated}`;
  document.title = `${L.name} — ${L.labels[st.doc === 'resume' ? 'resumeTitle' : 'careerTitle']}`;
  const w = document.getElementById('word'); w.href = D.files[st.doc][st.lang]; w.setAttribute('download', D.files[st.doc][st.lang]);
  [['t-resume', st.doc === 'resume'], ['t-career', st.doc === 'career'], ['l-ko', st.lang === 'ko'], ['l-en', st.lang === 'en']]
    .forEach(([id, on]) => document.getElementById(id).setAttribute('aria-pressed', on));
  try { localStorage.setItem('cv-view', JSON.stringify(st)); } catch (e) {}
  requestAnimationFrame(fitLines);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitLines);
}
document.getElementById('t-resume').onclick = () => { st.doc = 'resume'; render(); };
document.getElementById('t-career').onclick = () => { st.doc = 'career'; render(); };
document.getElementById('l-ko').onclick = () => { st.lang = 'ko'; render(); };
document.getElementById('l-en').onclick = () => { st.lang = 'en'; render(); };
if (location.protocol === 'file:') document.getElementById('act').hidden = false;
document.getElementById('print').onclick = () => window.print();
render();
</script>
